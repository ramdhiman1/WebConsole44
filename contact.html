<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Us - Ram Technical Help</title>
  <meta name="description" content="Have a technical problem or a question about QA testing? Contact the Ram Technical Help team for expert support and guidance.">
  <meta name="keywords" content="Contact Technical Support, QA Help, Tech Support, PC Fix, Mobile Fix">
  
  <!-- Security Headers -->
  
  
  
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <!-- Theme Flash Protection -->
  <script>
    (function () {
      const savedTheme = localStorage.getItem('theme') || 'light';
      document.documentElement.setAttribute('data-theme', savedTheme);
    })();
  </script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
  <script src="assets/js/components.js" defer></script>
  <script src="assets/js/app.js" defer></script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-AD_PLACEHOLDER_CLIENT_ID" crossorigin="anonymous"></script>
</head>

<body>

  <header class="site-header"></header>

  <main class="container">
    <div class="grid"
      style="grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 4rem; align-items: start;">

      <!-- Contact Info -->
      <div>
        <h1>Get in Touch</h1>
        <p class="muted" style="margin-bottom: 2rem;">Have a question, suggestion, or just want to say hi? We'd love to
          hear from you.</p>

        <div style="display: grid; gap: 1.5rem;">
          <div class="card" style="display: flex; gap: 1rem; align-items: center;">
            <div
              style="width: 40px; height: 40px; background: var(--bg-surface-alt); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.25rem;">
              📧</div>
            <div>
              <h3 style="margin: 0; font-size: 1rem;">Email Us</h3>
              <p class="muted" style="margin: 0;">support@ramtechnicalhelp.com</p>
            </div>
          </div>

          <div class="card" style="display: flex; gap: 1rem; align-items: center;">
            <div
              style="width: 40px; height: 40px; background: var(--bg-surface-alt); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.25rem;">
              💬</div>
            <div>
              <h3 style="margin: 0; font-size: 1rem;">Live Chat</h3>
              <p class="muted" style="margin: 0;">Available Mon-Fri, 10:00 AM - 6:00 PM IST</p>
            </div>
          </div>

          <div class="card" style="display: flex; gap: 1rem; align-items: center;">
            <div
              style="width: 40px; height: 40px; background: var(--bg-surface-alt); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.25rem;">
              📍</div>
            <div>
              <h3 style="margin: 0; font-size: 1rem;">Location</h3>
              <p class="muted" style="margin: 0;">A507, Moshi, Pune, Maharashtra, India</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Contact Form -->
      <div class="card">
        <h2 style="margin-bottom: 1.5rem;">Send us a message</h2>
        <form id="contactForm" action="https://formspree.io/f/YOUR_FORM_ID_HERE" method="POST">
<input type="hidden" name="csrf_token" value="generate_on_server_12345">
          <div class="form-group">
            <label for="name">Your Name</label>
            <input type="text" id="name" name="name" required placeholder="John Doe">
          </div>

          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required placeholder="john@example.com">
          </div>

          <div class="form-group">
            <label for="subject">Subject</label>
            <select id="subject" name="subject" required>
              <option value="" disabled selected>Select a subject</option>
              <option>General Inquiry</option>
              <option>Technical Support</option>
              <option>Feedback</option>
              <option>Partnership</option>
            </select>
          </div>

          <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" required placeholder="How can we help you?"></textarea>
          </div>

          <!-- Note: Captcha verification should be handled by Formspree optionally, replacing JS frontend check -->

          <button type="submit" id="submitBtn" class="btn btn-block" style="display: flex; align-items: center; justify-content: center; gap: 0.5rem;">
            <span id="btnText">Send Message</span>
            <div id="btnSpinner" class="spinner-sm" style="display: none;"></div>
          </button>
          <div id="formStatus" class="alert mt-4" style="display:none"></div>
        </form>
      </div>

    </div>
  </main>

  <footer class="site-footer"></footer>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('contactForm');
      const status = document.getElementById('formStatus');
      const btn = document.getElementById('submitBtn');
      const btnText = document.getElementById('btnText');
      const spinner = document.getElementById('btnSpinner');

      // If logged in, pre-fill
      const user = window.Auth ? Auth.getUser() : null;
      if (user) {
        document.getElementById('name').value = user.name || '';
        document.getElementById('email').value = user.email || '';
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        // Reset status
        status.style.display = 'none';
        status.className = 'alert mt-4';
        
        // Basic Security Sanitization
        const formData = new FormData(form);
        const data = Object.fromEntries(formData);
        
        // Loading State
        btn.disabled = true;
        btnText.textContent = 'Sending...';
        spinner.style.display = 'block';

        try {
          // Note: Replace 'YOUR_FORM_ID_HERE' with your actual Formspree ID
          const response = await fetch(form.action, {
            method: 'POST',
            body: formData,
            headers: {
              'Accept': 'application/json'
            }
          });

          if (response.ok) {
            status.textContent = "Thank you! Your message has been sent successfully. We will get back to you soon.";
            status.classList.add('ok');
            status.style.display = 'block';
            form.reset();
          } else {
            const result = await response.json();
            throw new Error(result.error || "Submission failed.");
          }
        } catch (error) {
          status.textContent = "Oops! Correlation error: " + (error.message || "Failed to send message. Please try again later.");
          status.classList.add('error');
          status.style.display = 'block';
        } finally {
          btn.disabled = false;
          btnText.textContent = 'Send Message';
          spinner.style.display = 'none';
        }
      });
    });
  </script>
</body>

</html>
