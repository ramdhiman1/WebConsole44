    function renderPosts(category = 'all') {
        const grid = document.getElementById('blog-grid');
        const filteredPosts = category === 'all' ? posts : posts.filter(p => p.tag === category);
        
        grid.innerHTML = filteredPosts.map(post => `
            <article class="card" style="display: flex; flex-direction: column; padding: 1.5rem; transition: var(--transition-base);">
                <div style="height: 140px; background: ${post.bg}; border-radius: 12px; display: flex; align-items: center; justify-content: center; margin-bottom: 1.5rem; font-size: 3.5rem;">
                    ${post.icon}
                </div>
                <div style="flex: 1;">
                    <div style="margin-bottom: 0.75rem; display: flex; align-items: center; gap: 0.75rem;">
                        <span class="label label-en">${post.tag}</span>
                        <small class="muted">${post.date}</small>
                    </div>
                    <h3 style="font-size: 1.25rem; margin-bottom: 0.75rem; line-height: 1.4;">
                        <a href="${post.url}" style="color: var(--text-main); text-decoration: none;">${post.title}</a>
                    </h3>
                    <p class="muted" style="font-size: 0.95rem; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;">${post.excerpt}</p>
                </div>
                <a href="${post.url}" class="btn btn-sm btn-secondary" style="margin-top: 1rem; width: 100%;">Read More</a>
            </article>
        `).join('');
    }

    function filterPosts() {
        const cat = document.getElementById('categoryFilter').value;
        renderPosts(cat);
    }

    // Initial Render
    renderPosts();
